<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Warung Smart POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-20">

    <!-- Header / Navbar -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fas fa-store"></i> Kasir Warung Smart
        </h1>
        <button onclick="switchTab('kasir')" class="bg-indigo-700 px-3 py-1.5 rounded-lg text-sm font-semibold">
            <i class="fas fa-cash-register"></i> Kasir
        </button>
        <button onclick="switchTab('produk')" class="bg-indigo-700 px-3 py-1.5 rounded-lg text-sm font-semibold">
            <i class="fas fa-box"></i> Kelola Produk
        </button>
    </header>

    <!-- TAB KASIR -->
    <main id="tab-kasir" class="p-4 max-w-md mx-auto">
        <h2 class="text-lg font-semibold text-gray-700 mb-3">Pilih Produk</h2>
        
        <!-- Daftar Produk -->
        <div id="grid-produk" class="grid grid-cols-2 gap-3 mb-6">
            <!-- Produk di-render otomatis via JS -->
        </div>

        <!-- Keranjang Belanja -->
        <div class="bg-white p-4 rounded-xl shadow-md border mb-4">
            <h3 class="font-bold text-gray-800 mb-2 border-b pb-2 flex justify-between">
                <span><i class="fas fa-shopping-cart text-indigo-600"></i> Keranjang</span>
                <button onclick="kosongkanKeranjang()" class="text-xs text-red-500 font-normal">Hapus Semua</button>
            </h3>
            <div id="daftar-keranjang" class="space-y-2 max-h-48 overflow-y-auto divide-y">
                <p class="text-sm text-gray-400 text-center py-4">Keranjang masih kosong</p>
            </div>
            
            <div class="border-t mt-4 pt-3 space-y-2">
                <div class="flex justify-between font-bold text-lg">
                    <span>Total:</span>
                    <span id="text-total" class="text-indigo-600">Rp 0</span>
                </div>
                <div>
                    <label class="text-xs text-gray-500 font-semibold">Bayar (Rp):</label>
                    <input type="number" id="input-bayar" oninput="hitungKembalian()" placeholder="0" class="w-full p-2 border rounded-lg text-right text-lg font-semibold border-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex justify-between font-semibold text-gray-700">
                    <span>Kembalian:</span>
                    <span id="text-kembalian" class="text-green-600">Rp 0</span>
                </div>
                <button onclick="prosesBayar()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow mt-2">
                    <i class="fas fa-print"></i> Bayar & Cetak Nota
                </button>
            </div>
        </div>
    </main>

    <!-- TAB KELOLA PRODUK -->
    <main id="tab-produk" class="p-4 max-w-md mx-auto hidden">
        <h2 class="text-lg font-semibold text-gray-700 mb-3">Tambah Produk Baru</h2>
        <div class="bg-white p-4 rounded-xl shadow-md border mb-6 space-y-3">
            <div>
                <label class="text-xs text-gray-500 font-semibold">Nama Produk</label>
                <input type="text" id="p-nama" placeholder="Contoh: Kopi Hitam" class="w-full p-2 border rounded-lg">
            </div>
            <div>
                <label class="text-xs text-gray-500 font-semibold">Harga (Rp)</label>
                <input type="number" id="p-harga" placeholder="3000" class="w-full p-2 border rounded-lg">
            </div>
            <button onclick="tambahProduk()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg">
                <i class="fas fa-plus"></i> Simpan Produk
            </button>
        </div>

        <h2 class="text-lg font-semibold text-gray-700 mb-3">Daftar Barang</h2>
        <div id="list-kelola-produk" class="space-y-2">
            <!-- List Produk Kelola -->
        </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
        let produkList = JSON.parse(localStorage.getItem('warung_produk')) || [
            { id: 1, nama: 'Kopi Hitam', harga: 3000 },
            { id: 2, nama: 'Es Teh Manis', harga: 4000 },
            { id: 3, nama: 'Mie Goreng', harga: 7000 }
        ];

        let keranjang = [];

        function simpanData() {
            localStorage.setItem('warung_produk', JSON.stringify(produkList));
            renderProduk();
        }

        function switchTab(tab) {
            document.getElementById('tab-kasir').classList.add('hidden');
            document.getElementById('tab-produk').classList.add('hidden');
            document.getElementById('tab-' + tab).classList.remove('hidden');
        }

        function renderProduk() {
            const grid = document.getElementById('grid-produk');
            const listKelola = document.getElementById('list-kelola-produk');
            
            grid.innerHTML = '';
            listKelola.innerHTML = '';

            produkList.forEach(p => {
                // Item Kasir
                grid.innerHTML += `
                    <div onclick="tambahKeKeranjang(${p.id})" class="bg-white p-3 rounded-xl shadow border active:scale-95 transition cursor-pointer flex flex-col justify-between">
                        <span class="font-semibold text-gray-800 text-sm leading-tight">${p.nama}</span>
                        <span class="text-indigo-600 font-bold text-sm mt-2">Rp ${p.harga.toLocaleString('id-ID')}</span>
                    </div>
                `;

                // Item Kelola
                listKelola.innerHTML += `
                    <div class="bg-white p-3 rounded-lg shadow border flex justify-between items-center">
                        <div>
                            <div class="font-semibold text-gray-800">${p.nama}</div>
                            <div class="text-sm text-indigo-600">Rp ${p.harga.toLocaleString('id-ID')}</div>
                        </div>
                        <button onclick="hapusProduk(${p.id})" class="text-red-500 p-2"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            });
        }

        function tambahKeKeranjang(id) {
            const produk = produkList.find(p => p.id === id);
            const item = keranjang.find(k => k.id === id);
            if (item) {
                item.qty++;
            } else {
                keranjang.push({ ...produk, qty: 1 });
            }
            renderKeranjang();
        }

        function renderKeranjang() {
            const container = document.getElementById('daftar-keranjang');
            if (keranjang.length === 0) {
                container.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">Keranjang masih kosong</p>';
                document.getElementById('text-total').innerText = 'Rp 0';
                hitungKembalian();
                return;
            }

            container.innerHTML = '';
            let total = 0;

            keranjang.forEach(item => {
                const subtotal = item.harga * item.qty;
                total += subtotal;
                container.innerHTML += `
                    <div class="flex justify-between items-center pt-2">
                        <div class="flex-1">
                            <div class="text-sm font-semibold">${item.nama}</div>
                            <div class="text-xs text-gray-500">Rp ${item.harga.toLocaleString('id-ID')} x ${item.qty}</div>
                        </div>
                        <div class="font-semibold text-sm mr-3">Rp ${subtotal.toLocaleString('id-ID')}</div>
                        <div class="flex items-center gap-1">
                            <button onclick="ubahQty(${item.id}, -1)" class="w-6 h-6 bg-gray-200 rounded text-xs font-bold">-</button>
                            <button onclick="ubahQty(${item.id}, 1)" class="w-6 h-6 bg-indigo-600 text-white rounded text-xs font-bold">+</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('text-total').innerText = 'Rp ' + total.toLocaleString('id-ID');
            hitungKembalian();
        }

        function ubahQty(id, delta) {
            const item = keranjang.find(k => k.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) {
                    keranjang = keranjang.filter(k => k.id !== id);
                }
            }
            renderKeranjang();
        }

        function kosongkanKeranjang() {
            keranjang = [];
            renderKeranjang();
        }

        function hitungKembalian() {
            let total = keranjang.reduce((sum, item) => sum + (item.harga * item.qty), 0);
            let bayar = parseFloat(document.getElementById('input-bayar').value) || 0;
            let kembalian = bayar - total;
            
            const textKembalian = document.getElementById('text-kembalian');
            if (kembalian >= 0) {
                textKembalian.innerText = 'Rp ' + kembalian.toLocaleString('id-ID');
                textKembalian.className = 'text-green-600 font-semibold';
            } else {
                textKembalian.innerText = 'Kurang Rp ' + Math.abs(kembalian).toLocaleString('id-ID');
                textKembalian.className = 'text-red-500 font-semibold';
            }
        }

        function prosesBayar() {
            let total = keranjang.reduce((sum, item) => sum + (item.harga * item.qty), 0);
            let bayar = parseFloat(document.getElementById('input-bayar').value) || 0;

            if (keranjang.length === 0) {
                alert('Keranjang masih kosong!');
                return;
            }
            if (bayar < total) {
                alert('Uang pembayaran masih kurang!');
                return;
            }

            alert('Transaksi Berhasil!\nKembalian: Rp ' + (bayar - total).toLocaleString('id-ID'));
            kosongkanKeranjang();
            document.getElementById('input-bayar').value = '';
        }

        function tambahProduk() {
            const nama = document.getElementById('p-nama').value.trim();
            const harga = parseFloat(document.getElementById('p-harga').value);

            if (!nama || !harga) {
                alert('Mohon isi nama dan harga produk!');
                return;
            }

            produkList.push({ id: Date.now(), nama, harga });
            simpanData();
            document.getElementById('p-nama').value = '';
            document.getElementById('p-harga').value = '';
            alert('Produk berhasil ditambahkan!');
        }

        function hapusProduk(id) {
            if (confirm('Yakin ingin menghapus produk ini?')) {
                produkList = produkList.filter(p => p.id !== id);
                simpanData();
            }
        }

        // Inisialisasi awal
        renderProduk();
    </script>
</body>
</html>
