<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Warung Smart POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-20">

    <!-- Header / Navbar -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fas fa-store"></i> Kasir Warung Smart
        </h1>
        <div class="flex gap-2">
            <button onclick="switchTab('kasir')" class="bg-indigo-700 px-3 py-1.5 rounded-lg text-sm flex items-center gap-1">
                <i class="fas fa-cash-register"></i> Kasir
            </button>
            <button onclick="switchTab('produk')" class="bg-indigo-700 px-3 py-1.5 rounded-lg text-sm flex items-center gap-1">
                <i class="fas fa-box"></i> Kelola Produk
            </button>
        </div>
    </header>

    <!-- TAB KASIR -->
    <main id="tab-kasir" class="p-4 max-w-md mx-auto">
        <h2 class="text-lg font-semibold text-gray-700 mb-3">Pilih Produk</h2>
        <div id="grid-produk" class="grid grid-cols-2 gap-3 mb-6">
            <div class="col-span-2 text-center text-gray-400 py-4">Memuat produk...</div>
        </div>

        <!-- Keranjang -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-gray-800 flex items-center gap-2">
                    <i class="fas fa-shopping-cart text-indigo-600"></i> Keranjang
                </h3>
                <button onclick="clearCart()" class="text-xs text-red-500 hover:underline">Hapus Semua</button>
            </div>
            <div id="cart-items" class="space-y-2 mb-4 text-sm text-gray-500">
                Keranjang masih kosong
            </div>
            <div class="border-t pt-3 space-y-2">
                <div class="flex justify-between font-bold text-lg text-gray-800">
                    <span>Total:</span>
                    <span id="total-price" class="text-indigo-600">Rp 0</span>
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">Bayar (Rp):</label>
                    <input type="number" id="pay-amount" oninput="calculateChange()" placeholder="0" class="w-full p-2 border rounded-lg text-right text-lg font-semibold">
                </div>
                <div class="flex justify-between text-sm text-gray-600 font-semibold pt-1">
                    <span>Kembalian:</span>
                    <span id="change-amount" class="text-green-600">Rp 0</span>
                </div>
                <button onclick="processPayment()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold flex items-center justify-center gap-2 shadow-md hover:bg-indigo-700 transition">
                    <i class="fas fa-print"></i> Bayar & Cetak Nota
                </button>
            </div>
        </div>
    </main>

    <!-- TAB KELOLA PRODUK -->
    <main id="tab-produk" class="p-4 max-w-md mx-auto hidden">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-6">
            <h2 class="text-lg font-bold text-gray-800 mb-3">Tambah Produk Baru</h2>
            <form id="add-product-form" onsubmit="addProduct(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-500 mb-1">Nama Produk</label>
                    <input type="text" id="prod-name" placeholder="Contoh: Kopi Hitam" required class="w-full p-2 border rounded-lg">
                </div>
                <div>
                    <label class="block text-xs text-gray-500 mb-1">Harga (Rp)</label>
                    <input type="number" id="prod-price" placeholder="3000" required class="w-full p-2 border rounded-lg">
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg font-semibold flex items-center justify-center gap-2">
                    <i class="fas fa-plus"></i> Simpan Produk
                </button>
            </form>
        </div>

        <h2 class="text-lg font-bold text-gray-800 mb-3">Daftar Barang</h2>
        <div id="product-list-manage" class="space-y-2"></div>
    </main>

    <script>
        const SUPABASE_URL = 'https://tmeobenomlfofnsnpxyh.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_Zysk_DB_Ae8lkl7s8qvDNA_3j6yYsTF';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let products = [];
        let cart = [];

        function switchTab(tab) {
            document.getElementById('tab-kasir').classList.toggle('hidden', tab !== 'kasir');
            document.getElementById('tab-produk').classList.toggle('hidden', tab !== 'produk');
        }

        async function fetchProducts() {
            const { data, error } = await supabaseClient.from('products').select('*');
            if (error) {
                console.error('Error fetching products:', error);
                document.getElementById('grid-produk').innerHTML = `<div class="col-span-2 text-center text-red-500 text-sm">Gagal memuat produk: ${error.message}</div>`;
                return;
            }
            products = data || [];
            renderProducts();
            renderManageProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('grid-produk');
            if (products.length === 0) {
                grid.innerHTML = '<div class="col-span-2 text-center text-gray-400 py-4">Belum ada produk</div>';
                return;
            }
            grid.innerHTML = products.map(p => `
                <button onclick="addToCart(${p.id})" class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 text-left hover:border-indigo-500 transition">
                    <div class="font-semibold text-gray-800 text-sm">${p.name}</div>
                    <div class="text-indigo-600 font-bold text-xs mt-1">Rp ${Number(p.price).toLocaleString('id-ID')}</div>
                </button>
            `).join('');
        }

        function renderManageProducts() {
            const list = document.getElementById('product-list-manage');
            list.innerHTML = products.map(p => `
                <div class="bg-white p-3 rounded-xl border flex justify-between items-center">
                    <div>
                        <div class="font-bold text-gray-800 text-sm">${p.name}</div>
                        <div class="text-xs text-indigo-600 font-semibold">Rp ${Number(p.price).toLocaleString('id-ID')}</div>
                    </div>
                    <button onclick="deleteProduct(${p.id})" class="text-red-500 hover:text-red-700 p-2">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            if (!prod) return;
            const item = cart.find(c => c.id === id);
            if (item) {
                item.qty++;
            } else {
                cart.push({ ...prod, qty: 1 });
            }
            renderCart();
        }

        function renderCart() {
            const cartContainer = document.getElementById('cart-items');
            if (cart.length === 0) {
                cartContainer.innerHTML = '<div class="text-center py-2">Keranjang masih kosong</div>';
                document.getElementById('total-price').innerText = 'Rp 0';
                calculateChange();
                return;
            }

            cartContainer.innerHTML = cart.map(c => `
                <div class="flex justify-between items-center">
                    <div>
                        <span class="font-semibold text-gray-800">${c.name}</span>
                        <span class="text-xs text-gray-500"> x${c.qty}</span>
                    </div>
                    <span class="font-bold text-gray-700">Rp ${(c.price * c.qty).toLocaleString('id-ID')}</span>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('total-price').innerText = 'Rp ' + total.toLocaleString('id-ID');
            calculateChange();
        }

        function clearCart() {
            cart = [];
            renderCart();
        }

        function calculateChange() {
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const pay = Number(document.getElementById('pay-amount').value) || 0;
            const change = pay - total;
            document.getElementById('change-amount').innerText = 'Rp ' + (change >= 0 ? change.toLocaleString('id-ID') : 0);
        }

        async function addProduct(e) {
            e.preventDefault();
            const name = document.getElementById('prod-name').value;
            const price = Number(document.getElementById('prod-price').value);

            const { error } = await supabaseClient.from('products').insert([{ name, price }]);
            if (error) {
                alert('Gagal menambah produk: ' + error.message);
            } else {
                document.getElementById('add-product-form').reset();
                fetchProducts();
            }
        }

        async function deleteProduct(id) {
            if (!confirm('Yakin ingin menghapus produk ini?')) return;
            const { error } = await supabaseClient.from('products').delete().eq('id', id);
            if (error) {
                alert('Gagal menghapus produk: ' + error.message);
            } else {
                fetchProducts();
            }
        }

        function processPayment() {
            if (cart.length === 0) {
                alert('Keranjang masih kosong!');
                return;
            }
            alert('Transaksi Berhasil!');
            clearCart();
            document.getElementById('pay-amount').value = '';
        }

        fetchProducts();
    </script>
</body>
</html>
