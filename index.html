<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Warung Smart POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-800 pb-24">

    <!-- Header Atas -->
    <header class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-40">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fas fa-store text-emerald-400 text-xl"></i>
                <h1 class="font-bold text-lg tracking-wide">Kasir Warung Smart</h1>
            </div>
            <span class="text-xs bg-slate-800 text-emerald-400 px-2.5 py-1 rounded-full border border-slate-700">Online</span>
        </div>
    </header>

    <!-- Navigasi Tab Bottom / Top -->
    <nav class="bg-slate-800 text-slate-300 border-b border-slate-700 sticky top-14 z-30 shadow">
        <div class="max-w-md mx-auto flex justify-around text-xs font-semibold">
            <button onclick="switchTab('kasir')" id="nav-kasir" class="flex-1 py-3 text-emerald-400 border-b-2 border-emerald-400 flex justify-center items-center gap-1.5">
                <i class="fas fa-cash-register text-sm"></i> Kasir
            </button>
            <button onclick="switchTab('produk')" id="nav-produk" class="flex-1 py-3 hover:text-white flex justify-center items-center gap-1.5">
                <i class="fas fa-boxes-stacked text-sm"></i> Stok & Produk
            </button>
            <button onclick="switchTab('riwayat')" id="nav-riwayat" class="flex-1 py-3 hover:text-white flex justify-center items-center gap-1.5">
                <i class="fas fa-receipt text-sm"></i> Riwayat
            </button>
        </div>
    </nav>

    <!-- Halaman KASIR -->
    <main id="tab-kasir" class="p-4 max-w-md mx-auto space-y-4">
        <!-- Input Cari Barang -->
        <div class="relative">
            <i class="fas fa-search absolute left-3 top-3.5 text-slate-400"></i>
            <input type="text" id="search-input" onkeyup="filterProduk()" placeholder="Cari nama barang..." class="w-full pl-9 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl shadow-sm text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <!-- Grid Produk -->
        <div id="grid-produk" class="grid grid-cols-2 gap-2.5">
            <!-- Render via JS -->
        </div>

        <!-- Ringkasan Keranjang -->
        <div class="bg-white rounded-2xl shadow-md border border-slate-100 p-4 space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <span class="font-bold text-slate-800 flex items-center gap-2">
                    <i class="fas fa-shopping-basket text-emerald-600"></i> Pesanan
                </span>
                <button onclick="kosongkanKeranjang()" class="text-xs text-rose-500 hover:underline">Kosongkan</button>
            </div>

            <div id="daftar-keranjang" class="space-y-2 max-h-52 overflow-y-auto divide-y divide-slate-100 pr-1">
                <p class="text-xs text-slate-400 text-center py-4">Belum ada barang dipilih</p>
            </div>

            <div class="border-t border-slate-200 pt-3 space-y-2 text-sm">
                <div class="flex justify-between font-bold text-base text-slate-900">
                    <span>Total Tagihan:</span>
                    <span id="text-total" class="text-emerald-600 text-lg">Rp 0</span>
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-500">Uang Pembayaran (Rp)</label>
                    <input type="number" id="input-bayar" oninput="hitungKembalian()" placeholder="0" class="w-full p-2.5 mt-1 border border-slate-300 rounded-xl text-right font-bold text-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>
                <div class="flex justify-between font-semibold text-slate-700 text-xs">
                    <span>Kembalian:</span>
                    <span id="text-kembalian" class="text-slate-900 font-bold">Rp 0</span>
                </div>
                <button onclick="prosesBayar()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md transition active:scale-98 flex justify-center items-center gap-2 mt-2">
                    <i class="fas fa-check-circle"></i> Selesaikan Transaksi
                </button>
            </div>
        </div>
    </main>

    <!-- Halaman KELOLA PRODUK -->
    <main id="tab-produk" class="p-4 max-w-md mx-auto space-y-4 hidden">
        <div class="bg-white p-4 rounded-2xl shadow-md border border-slate-100 space-y-3">
            <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                <i class="fas fa-plus-circle text-emerald-600"></i> Tambah / Edit Produk
            </h3>
            <div>
                <label class="text-xs font-semibold text-slate-500">Nama Barang</label>
                <input type="text" id="p-nama" placeholder="Contoh: Es Batang Tiga" class="w-full p-2 border border-slate-200 rounded-lg text-sm mt-1">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-xs font-semibold text-slate-500">Harga (Rp)</label>
                    <input type="number" id="p-harga" placeholder="5000" class="w-full p-2 border border-slate-200 rounded-lg text-sm mt-1">
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-500">Jumlah Stok <span class="text-slate-400 font-normal">(Kosongkan jika ∞)</span></label>
                    <input type="number" id="p-stok" placeholder="Opsional / Kosong" class="w-full p-2 border border-slate-200 rounded-lg text-sm mt-1">
                </div>
            </div>
            <button onclick="tambahProduk()" class="w-full bg-slate-900 text-white font-semibold py-2.5 rounded-xl text-sm hover:bg-slate-800">
                Simpan Produk
            </button>
        </div>

        <div class="space-y-2">
            <h3 class="font-bold text-slate-700 text-sm">Daftar Stok Produk</h3>
            <div id="list-kelola-produk" class="space-y-2">
                <!-- Render via JS -->
            </div>
        </div>
    </main>

    <!-- Halaman RIWAYAT -->
    <main id="tab-riwayat" class="p-4 max-w-md mx-auto space-y-3 hidden">
        <h3 class="font-bold text-slate-800 text-sm">Riwayat Penjualan</h3>
        <div id="list-riwayat" class="space-y-2">
            <!-- Render via JS -->
        </div>
    </main>

    <!-- Modal Struk / Nota -->
    <div id="modal-nota" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4">
            <div class="text-center border-b border-dashed pb-3">
                <h4 class="font-bold text-lg text-slate-900">WARUNG SMART POS</h4>
                <p class="text-xs text-slate-500" id="nota-tanggal"></p>
            </div>
            <div id="nota-items" class="space-y-1.5 text-xs text-slate-700"></div>
            <div class="border-t border-dashed pt-3 text-xs space-y-1">
                <div class="flex justify-between font-bold text-sm">
                    <span>Total:</span>
                    <span id="nota-total"></span>
                </div>
                <div class="flex justify-between text-slate-600">
                    <span>Bayar:</span>
                    <span id="nota-bayar"></span>
                </div>
                <div class="flex justify-between text-slate-600">
                    <span>Kembali:</span>
                    <span id="nota-kembali"></span>
                </div>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="tutupNota()" class="flex-1 bg-slate-200 text-slate-700 py-2 rounded-xl font-bold text-xs">Tutup</button>
                <button onclick="window.print()" class="flex-1 bg-emerald-600 text-white py-2 rounded-xl font-bold text-xs">Cetak Struk</button>
            </div>
        </div>
    </div>

    <script>
        let produkList = JSON.parse(localStorage.getItem('warung_produk_v2')) || [
            { id: 1, nama: 'Kopi Hitam', harga: 3000, stok: null },
            { id: 2, nama: 'Es Teh Manis', harga: 4000, stok: 20 },
            { id: 3, nama: 'Mie Goreng', harga: 7000, stok: 15 }
        ];

        let keranjang = [];
        let riwayat = JSON.parse(localStorage.getItem('warung_riwayat')) || [];

        function simpanData() {
            localStorage.setItem('warung_produk_v2', JSON.stringify(produkList));
            localStorage.setItem('warung_riwayat', JSON.stringify(riwayat));
            renderProduk();
            renderRiwayat();
        }

        function switchTab(tab) {
            ['kasir', 'produk', 'riwayat'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
                document.getElementById('nav-' + t).className = "flex-1 py-3 hover:text-white flex justify-center items-center gap-1.5 text-slate-400";
            });
            document.getElementById('tab-' + tab).classList.remove('hidden');
            document.getElementById('nav-' + tab).className = "flex-1 py-3 text-emerald-400 border-b-2 border-emerald-400 flex justify-center items-center gap-1.5 font-bold";
        }

        function renderProduk(query = '') {
            const grid = document.getElementById('grid-produk');
            const listKelola = document.getElementById('list-kelola-produk');
            grid.innerHTML = '';
            listKelola.innerHTML = '';

            const filtered = produkList.filter(p => p.nama.toLowerCase().includes(query.toLowerCase()));

            filtered.forEach(p => {
                const stokText = (p.stok === null || p.stok === '' || isNaN(p.stok)) ? 'Stok: ∞' : `Stok: ${p.stok}`;
                const isHabis = (p.stok !== null && p.stok !== '' && !isNaN(p.stok) && p.stok <= 0);

                grid.innerHTML += `
                    <div onclick="${isHabis ? '' : `tambahKeKeranjang(${p.id})`}" class="bg-white p-3 rounded-xl border border-slate-200/80 shadow-sm active:scale-95 transition cursor-pointer flex flex-col justify-between ${isHabis ? 'opacity-50 pointer-events-none' : ''}">
                        <div>
                            <span class="font-semibold text-slate-800 text-xs block truncate">${p.nama}</span>
                            <span class="text-xs text-slate-400">${stokText}</span>
                        </div>
                        <span class="text-emerald-600 font-bold text-sm mt-2">Rp ${p.harga.toLocaleString('id-ID')}</span>
                    </div>
                `;

                listKelola.innerHTML += `
                    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center">
                        <div>
                            <div class="font-semibold text-slate-800 text-sm">${p.nama}</div>
                            <div class="text-xs text-emerald-600 font-bold">Rp ${p.harga.toLocaleString('id-ID')} | <span class="text-slate-500 font-normal">${stokText}</span></div>
                        </div>
                        <button onclick="hapusProduk(${p.id})" class="text-rose-500 hover:bg-rose-50 p-2 rounded-lg text-sm"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            });
        }

        function filterProduk() {
            const q = document.getElementById('search-input').value;
            renderProduk(q);
        }

        function tambahKeKeranjang(id) {
            const p = produkList.find(x => x.id === id);
            const item = keranjang.find(k => k.id === id);

            if (p.stok !== null && p.stok !== '' && !isNaN(p.stok)) {
                const currentQty = item ? item.qty : 0;
                if (currentQty + 1 > p.stok) {
                    alert('Stok barang tidak cukup!');
                    return;
                }
            }

            if (item) {
                item.qty++;
            } else {
                keranjang.push({ ...p, qty: 1 });
            }
            renderKeranjang();
        }

        function renderKeranjang() {
            const container = document.getElementById('daftar-keranjang');
            if (keranjang.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Belum ada barang dipilih</p>';
                document.getElementById('text-total').innerText = 'Rp 0';
                hitungKembalian();
                return;
            }

            container.innerHTML = '';
            let total = 0;

            keranjang.forEach(item => {
                const subtotal = item.harga * item.qty;
                total += subtotal;
                container.innerHTML += `
                    <div class="flex justify-between items-center pt-2 text-xs">
                        <div class="flex-1">
                            <div class="font-bold text-slate-800">${item.nama}</div>
                            <div class="text-slate-400">Rp ${item.harga.toLocaleString('id-ID')} x ${item.qty}</div>
                        </div>
                        <div class="font-bold text-slate-800 mr-2">Rp ${subtotal.toLocaleString('id-ID')}</div>
                        <div class="flex items-center gap-1">
                            <button onclick="ubahQty(${item.id}, -1)" class="w-5 h-5 bg-slate-200 rounded text-slate-700 font-bold">-</button>
                            <button onclick="ubahQty(${item.id}, 1)" class="w-5 h-5 bg-emerald-600 text-white rounded font-bold">+</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('text-total').innerText = 'Rp ' + total.toLocaleString('id-ID');
            hitungKembalian();
        }

        function ubahQty(id, delta) {
            const item = keranjang.find(k => k.id === id);
            const p = produkList.find(x => x.id === id);
            if (item) {
                if (delta > 0 && p.stok !== null && p.stok !== '' && !isNaN(p.stok)) {
                    if (item.qty + 1 > p.stok) {
                        alert('Stok barang sudah mencapai batas!');
                        return;
                    }
                }
                item.qty += delta;
                if (item.qty <= 0) {
                    keranjang = keranjang.filter(k => k.id !== id);
                }
            }
            renderKeranjang();
        }

        function kosongkanKeranjang() {
            keranjang = [];
            renderKeranjang();
        }

        function hitungKembalian() {
            let total = keranjang.reduce((sum, item) => sum + (item.harga * item.qty), 0);
            let bayar = parseFloat(document.getElementById('input-bayar').value) || 0;
            let kembalian = bayar - total;
            
            const textKembalian = document.getElementById('text-kembalian');
            if (kembalian >= 0) {
                textKembalian.innerText = 'Rp ' + kembalian.toLocaleString('id-ID');
                textKembalian.className = 'text-emerald-600 font-bold';
            } else {
                textKembalian.innerText = 'Kurang Rp ' + Math.abs(kembalian).toLocaleString('id-ID');
                textKembalian.className = 'text-rose-500 font-bold';
            }
        }

        function prosesBayar() {
            let total = keranjang.reduce((sum, item) => sum + (item.harga * item.qty), 0);
            let bayar = parseFloat(document.getElementById('input-bayar').value) || 0;

            if (keranjang.length === 0) return alert('Keranjang masih kosong!');
            if (bayar < total) return alert('Uang pembayaran masih kurang!');

            // Potong stok produk
            keranjang.forEach(k => {
                const p = produkList.find(x => x.id === k.id);
                if (p && p.stok !== null && p.stok !== '' && !isNaN(p.stok)) {
                    p.stok -= k.qty;
                }
            });

            // Catat riwayat
            const tgl = new Date().toLocaleString('id-ID');
            riwayat.unshift({ tanggal: tgl, total, item: [...keranjang] });

            simpanData();
            tampilkanNota(tgl, keranjang, total, bayar, bayar - total);

            keranjang = [];
            renderKeranjang();
            document.getElementById('input-bayar').value = '';
        }

        function tampilkanNota(tgl, items, total, bayar, kembali) {
            document.getElementById('nota-tanggal').innerText = tgl;
            const container = document.getElementById('nota-items');
            container.innerHTML = '';
            items.forEach(i => {
                container.innerHTML += `
                    <div class="flex justify-between">
                        <span>${i.nama} x${i.qty}</span>
                        <span>Rp ${(i.harga * i.qty).toLocaleString('id-ID')}</span>
                    </div>
                `;
            });
            document.getElementById('nota-total').innerText = 'Rp ' + total.toLocaleString('id-ID');
            document.getElementById('nota-bayar').innerText = 'Rp ' + bayar.toLocaleString('id-ID');
            document.getElementById('nota-kembali').innerText = 'Rp ' + kembali.toLocaleString('id-ID');
            document.getElementById('modal-nota').classList.remove('hidden');
        }

        function tutupNota() {
            document.getElementById('modal-nota').classList.add('hidden');
        }

        function tambahProduk() {
            const nama = document.getElementById('p-nama').value.trim();
            const harga = parseFloat(document.getElementById('p-harga').value);
            const stokVal = document.getElementById('p-stok').value;
            const stok = stokVal === '' ? null : parseInt(stokVal);

            if (!nama || isNaN(harga)) return alert('Isi nama dan harga dengan benar!');

            produkList.push({ id: Date.now(), nama, harga, stok });
            simpanData();
            document.getElementById('p-nama').value = '';
            document.getElementById('p-harga').value = '';
            document.getElementById('p-stok').value = '';
            alert('Produk disimpan!');
        }

        function hapusProduk(id) {
            if (confirm('Hapus produk ini?')) {
                produkList = produkList.filter(p => p.id !== id);
                simpanData();
            }
        }

        function renderRiwayat() {
            const container = document.getElementById('list-riwayat');
            if (riwayat.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Belum ada transaksi</p>';
                return;
            }
            container.innerHTML = '';
            riwayat.forEach(r => {
                container.innerHTML += `
                    <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm text-xs space-y-1">
                        <div class="flex justify-between text-slate-400">
                            <span>${r.tanggal}</span>
                            <span class="font-bold text-emerald-600">Rp ${r.total.toLocaleString('id-ID')}</span>
                        </div>
                        <div class="text-slate-700">${r.item.map(i => `${i.nama} (${i.qty})`).join(', ')}</div>
                    </div>
                `;
            });
        }

        // Inisialisasi awal
        renderProduk();
        renderRiwayat();
    </script>
</body>
</html>
