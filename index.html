<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Warung - POS Smart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d9488">
    <style>
        .active-tab { color: #0d9488; font-weight: bold; }
        @media print {
            body * { visibility: hidden; }
            #receipt-print, #receipt-print * { visibility: visible; }
            #receipt-print { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen pb-20 select-none">

    <header class="bg-teal-600 text-white p-4 sticky top-0 z-40 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-white/20 rounded-xl flex items-center justify-center font-bold text-lg">🛍️</div>
            <div>
                <h1 class="text-base font-bold leading-tight">Kasir Warung</h1>
                <p class="text-[11px] text-teal-100 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span> Mode Offline Ready
                </p>
            </div>
        </div>
        <button onclick="switchTab('kasir')" class="bg-teal-700 hover:bg-teal-800 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-2">
            🛒 Keranjang (<span id="cartCount">0</span>)
        </button>
    </header>

    <main class="p-3 max-w-lg mx-auto space-y-4">

        <section id="view-beranda" class="space-y-3">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
                <div>
                    <span class="text-xs text-gray-400 block font-medium">Total Penjualan Hari Ini</span>
                    <h2 id="dashOmzet" class="text-2xl font-extrabold text-teal-600">Rp 0</h2>
                </div>
                <div class="text-right">
                    <span class="text-xs text-gray-400 block font-medium">Transaksi</span>
                    <h3 id="dashOrders" class="text-lg font-bold text-gray-700">0 Transaksi</h3>
                </div>
            </div>

            <div class="grid grid-cols-4 gap-2 text-center">
                <button onclick="switchTab('kasir')" class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center">
                    <div class="w-10 h-10 bg-teal-50 text-teal-600 rounded-xl flex items-center justify-center text-lg mb-1">🛒</div>
                    <span class="text-[11px] font-semibold text-gray-600">Kasir</span>
                </button>
                <button onclick="switchTab('seblak')" class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center">
                    <div class="w-10 h-10 bg-orange-50 text-orange-500 rounded-xl flex items-center justify-center text-lg mb-1">🔥</div>
                    <span class="text-[11px] font-semibold text-gray-600">Seblak</span>
                </button>
                <button onclick="switchTab('kasbon')" class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center">
                    <div class="w-10 h-10 bg-amber-50 text-amber-600 rounded-xl flex items-center justify-center text-lg mb-1">📖</div>
                    <span class="text-[11px] font-semibold text-gray-600">Kasbon</span>
                </button>
                <button onclick="switchTab('produk')" class="bg-white p-3 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center">
                    <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-lg mb-1">📦</div>
                    <span class="text-[11px] font-semibold text-gray-600">Stok</span>
                </button>
            </div>

            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                    <i class="fa-solid fa-triangle-exclamation text-amber-500"></i> Peringatan Stok Menipis
                </h3>
                <div id="lowStockList" class="space-y-2 text-xs"></div>
            </div>
        </section>

        <section id="view-produk" class="hidden space-y-3">
            <div class="flex justify-between items-center gap-2">
                <h2 class="text-base font-bold text-gray-800">Manajemen Produk</h2>
                <div class="flex gap-1.5">
                    <label class="bg-emerald-600 text-white px-2.5 py-1.5 rounded-xl text-xs font-bold cursor-pointer flex items-center gap-1">
                        <i class="fa-solid fa-file-excel"></i> Impor
                        <input type="file" id="excelInput" accept=".csv" onchange="importCSV(event)" class="hidden">
                    </label>
                    <button onclick="openAddProductModal()" class="bg-teal-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm">
                        + Produk
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <input type="text" id="searchProductInput" onkeyup="renderProducts()" placeholder="🔍 Cari nama/barcode..." class="bg-white border border-gray-200 rounded-xl p-2 text-xs shadow-sm">
                <select id="filterCategory" onchange="renderProducts()" class="bg-white border border-gray-200 rounded-xl p-2 text-xs shadow-sm">
                    <option value="">Semua Kategori</option>
                    <option value="Makanan">Makanan</option>
                    <option value="Minuman">Minuman</option>
                    <option value="Rokok">Rokok</option>
                    <option value="Sembako">Sembako</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>

            <div id="produkMasterList" class="space-y-2"></div>
        </section>

        <section id="view-kasir" class="hidden space-y-3">
            <div class="flex gap-2">
                <div class="relative flex-1">
                    <input type="text" id="kasirSearch" onkeyup="renderKasirGrid()" placeholder="Cari nama / scan barcode..." class="w-full bg-white border border-gray-200 rounded-xl p-2.5 text-xs pr-8 shadow-sm">
                    <button onclick="toggleScanner('kasir')" class="absolute right-2 top-2 text-gray-400 hover:text-teal-600">
                        <i class="fa-solid fa-barcode text-base"></i>
                    </button>
                </div>
                <button onclick="switchTab('seblak')" class="bg-orange-500 text-white px-3 py-2.5 rounded-xl text-xs font-bold flex items-center gap-1 shadow-sm">
                    🔥 Seblak
                </button>
            </div>

            <div id="reader-kasir" class="hidden rounded-xl overflow-hidden border border-indigo-200"></div>

            <div id="categoryCapsules" class="flex gap-1.5 overflow-x-auto pb-1 text-xs">
                <button onclick="filterKasirCat('')" class="bg-teal-600 text-white px-3 py-1 rounded-full font-bold whitespace-nowrap">Semua</button>
                <button onclick="filterKasirCat('Makanan')" class="bg-white text-gray-600 px-3 py-1 rounded-full font-medium whitespace-nowrap border">Makanan</button>
                <button onclick="filterKasirCat('Minuman')" class="bg-white text-gray-600 px-3 py-1 rounded-full font-medium whitespace-nowrap border">Minuman</button>
                <button onclick="filterKasirCat('Rokok')" class="bg-white text-gray-600 px-3 py-1 rounded-full font-medium whitespace-nowrap border">Rokok
